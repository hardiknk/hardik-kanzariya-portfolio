name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_AVAILABILITY_STATUS: ${{ vars.VITE_AVAILABILITY_STATUS }}
          VITE_WORK_PREFERENCE: ${{ vars.VITE_WORK_PREFERENCE }}
          VITE_REMOTE_TIMEZONE: ${{ vars.VITE_REMOTE_TIMEZONE }}
          VITE_TARGET_ROLE: ${{ vars.VITE_TARGET_ROLE }}
          VITE_PROFILE_IMAGE_MODE: ${{ vars.VITE_PROFILE_IMAGE_MODE }}
          VITE_PROFILE_IMAGE_PATH: ${{ vars.VITE_PROFILE_IMAGE_PATH }}
          VITE_LINKEDIN_URL: ${{ vars.VITE_LINKEDIN_URL }}
          VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
